name: Build Windows installer

# Every push to main builds Hearth on GitHub's Windows machines and publishes
# the installer as a GitHub Release named after the app version
# (src-tauri/tauri.conf.json). Download Hearth_x.y.z_x64-setup.exe from the
# Releases page; nothing needs to be installed on your own PC.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Hearth v__VERSION__
          releaseBody: Download the setup.exe below and run it. See CHANGES-*.md for what changed.
          releaseDraft: false
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
